name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nyc_app
          POSTGRES_PASSWORD: nyc_app
          POSTGRES_DB: nyc_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyc_app -d nyc_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches docker-compose.yml / .env.example; db:check + schema tests need it.
      DATABASE_URL: postgresql://nyc_app:nyc_app@localhost:5432/nyc_app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Portability is a locked decision: the app must stay deployable anywhere,
      # so cloud-provider SDKs are banned from dependencies.
      - name: Portability gate — no cloud-provider SDKs
        run: |
          if grep -nE '"@aws-sdk/|"@azure/' package.json; then
            echo "::error::Cloud-provider SDK dependencies (@aws-sdk/*, @azure/*) are not allowed."
            exit 1
          fi

      - name: Apply migrations
        run: pnpm db:migrate

      # Schema in code must match committed migrations exactly.
      - name: Drizzle drift check
        run: pnpm db:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
