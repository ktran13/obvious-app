<!-- Storybook has no next/font runtime, so the --font-* theme variables
     resolve to nothing and stories fall back to serif defaults. Mirror the
     app's Google-Fonts loading (layout.tsx) under the same variable names —
     Fraunces (display), Inter (sans), Caveat (hand), Geist Mono (mono). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fraunces:opsz,wght@9..144,300..900&family=Geist+Mono:wght@100..900&family=Inter:wght@100..900&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --font-caveat: "Caveat";
    --font-fraunces: "Fraunces";
    --font-inter: "Inter";
    --font-geist-mono: "Geist Mono";
  }
</style>
